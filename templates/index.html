{% extends 'base.html' %}

{% block title %}首頁 - 校園論壇與設施評價系統{% endblock %}

{% block content %}
<div class="hero">
    <h1>校園論壇與設施評價系統</h1>
    <p>在這裡，您可以探索校園內的各種設施評價，或是參與論壇討論，分享您的校園生活！</p>
    <div class="hero-buttons">
        <a href="#" class="btn-primary btn-large">尋找設施</a>
        <a href="#" class="btn-outline btn-large">進入論壇</a>
    </div>
</div>

<div class="features-grid">
    <div class="feature-card">
        <h3>設施評價 ⭐️</h3>
        <p>提供廁所、讀書空間、學餐座位等校園設施的最真實評價與星等，幫您快速避雷！</p>
    </div>
    <div class="feature-card">
        <h3>二手交易 🛒</h3>
        <p>教科書、宿舍用品、腳踏車買賣，通通可以在二手交易看板找到。</p>
    </div>
    <div class="feature-card">
        <h3>匿名討論 💬</h3>
        <p>在心情版分享您的校園點滴，或是討論最新的選課資訊與八卦。</p>
    </div>
</div>
{% endblock %}
