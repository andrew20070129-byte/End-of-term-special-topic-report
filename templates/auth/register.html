{% extends 'base.html' %}

{% block title %}註冊 - 校園論壇與設施評價系統{% endblock %}

{% block content %}
<div class="form-container">
    <h2>註冊新帳號</h2>
    <form action="{{ url_for('register') }}" method="POST">
        <div class="form-group">
            <label for="username">使用者名稱</label>
            <input type="text" id="username" name="username" class="form-control" required placeholder="請輸入學號或暱稱">
        </div>
        <div class="form-group">
            <label for="password">密碼</label>
            <input type="password" id="password" name="password" class="form-control" required placeholder="請設定密碼">
        </div>
        <button type="submit" class="btn-primary btn-block">建立帳號</button>
    </form>
    <div class="auth-redirect">
        已經有帳號了嗎？ <a href="{{ url_for('login') }}">立即登入</a>
    </div>
</div>
{% endblock %}
