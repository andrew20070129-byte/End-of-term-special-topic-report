{% extends 'base.html' %}

{% block title %}設施列表 - 校園論壇與設施評價系統{% endblock %}

{% block content %}
<div class="page-header">
    <h2>校園設施列表</h2>
    <p>點擊下方設施查看詳細資訊與大家的評價吧！</p>
</div>

<div class="features-grid">
    {% for facility in facilities %}
    <a href="{{ url_for('facility_detail', id=facility.id) }}" class="feature-card" style="text-decoration: none;">
        <span class="badge badge-primary">{{ facility.category }}</span>
        <h3 style="margin-top: 1rem;">{{ facility.name }}</h3>
        <p>{{ facility.description }}</p>
    </a>
    {% else %}
    <p>目前還沒有任何設施資料喔！</p>
    {% endfor %}
</div>
{% endblock %}
